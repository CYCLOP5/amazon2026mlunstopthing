# =============================================================================
#  Business Entity Resolution - pipeline configuration  (THE file to edit)
#
#  Every [section] configures one part of the pipeline.  For a new experiment,
#  create configs/experiments/<name>.toml containing
#        extends = "../default.toml"
#  plus only the keys you change, and run
#        python src/run.py -c configs/experiments/<name>.toml
#  Stages whose settings did not change are reused from cache automatically
#  (e.g. a new [model] re-uses normalisation, blocking and features).
#  List available components:  python src/run.py list
# =============================================================================

[experiment]
name = "lgbm_baseline"            # results -> experiments/<name>/

[paths]
data = ""                         # "" = auto: ./dataset or ../../dataset (challenge layout)
work = ""                         # "" = ./work   (cached stage outputs, ~8 GB)
experiments = ""                  # "" = ./experiments

[resources]
threads = 0                       # 0 = half of the logical CPU cores
priority = "normal"               # normal | low (below-normal, keeps the PC snappy)
min_free_gb = 1.5                 # a stage aborts cleanly if free RAM drops below this

# ---------------------------------------------------------------- stage: prep
[prep]
chunk_rows = 1_000_000            # records normalised per batch
# normalisation rules: src/er/normalize/rules.py

# ------------------------------------------------------------ stage: blocking
[blocking]
method = "skeleton_tfidf"         # registered in src/er/blocking/
top_k = 10                        # candidates kept per Source-2/3 record
retrieve_k = 40                   # over-retrieval depth before exact re-ranking
max_df1 = 2000                    # tokens in more Source-1 records than this cannot create candidates alone
chunk_rows = 500_000              # Source-2/3 records per chunk (RAM vs speed)

[blocking.tokens]                 # token families used for retrieval
name_unigrams = true
name_bigrams = true
compact_name = true
address_unigrams = true
address_bigrams = true

# ------------------------------------------------ final candidate set (model input)
[candidates]
top_k = 10                        # keep blocking rank < top_k ...
min_rel_score = 0.6               # ... and bscore >= min_rel_score * best bscore of the record

# ------------------------------------------------------------ stage: features
[features]
groups = ["context", "name", "address", "numbers"]   # registered in src/er/features/
part_rows = 1_000_000
cache_test = true                 # store test features once (~5 GB) so every model reuses them

# ------------------------------------------------------ stage: train (sampling)
[training]
sample_pct = 20                   # % of training Source-1 entities that get features
train_pct = 14                    # hash bucket < train_pct          -> fit
val_pct = 20                      # train_pct <= bucket < val_pct    -> validation
hash_seed = 42

# ---------------------------------------------------------------- the model
[model]
name = "lightgbm"                 # lightgbm | xgboost | sklearn_hgb | logreg  (src/er/models/)
exclude_features = []             # drop features for this model only (no recomputation)

[model.params]                    # passed to the model library
learning_rate = 0.05
num_leaves = 255
min_data_in_leaf = 100
feature_fraction = 0.8
bagging_fraction = 0.8
bagging_freq = 1
lambda_l2 = 1.0
max_bin = 255
seed = 7

[model.fit]
num_boost_round = 3000
early_stopping_rounds = 100
log_every = 100

# ------------------------------------------------------------- decision rule
[decision]
rule = "argmax_threshold"         # argmax_threshold | threshold   (src/er/decision/)
threshold = "auto"                # "auto" = best validation macro F0.5 on the grid, or a number
grid = [0.10, 0.95, 0.025]        # start, stop, step
