# Stacker on the teammate's neural candidates (see src/er/stack/__init__.py)
#   python src/run.py stack -c configs/stack.toml --set stack.data=... (paths usually set by the Azure job)
extends = "default.toml"

[experiment]
name = "stack_upgraded_k3"

[resources]
threads = 0.9                     # big dedicated CPU machine
priority = "normal"
min_free_gb = 8

[stack]
work = ""                         # big cached tables ("" = experiments/<name>/stack)
data = ""                         # prepared records: <data>/{train,test}/{ref,s2,s3}.parquet
train_roots = []                  # folders holding scored runs (manifest.json + parts/) of the labelled pool
test_roots = []                   # ... of the test pool
require_complete = true           # every Source-2/3 record must be covered exactly once
eval_folds = [0, 1]               # records that can reach these entity folds get features
fit_fold = 0                      # stacker fitted (cross-fitted) and rule/threshold chosen here
audit_fold = 1                    # untouched audit
cv = 5
seed = 42
text_groups = ["name", "address", "numbers"]
chunk_rows = 2_000_000
confident_p = 0.5                 # round-2 siblings: records owned with round-1 p >= this
lexical_train = []                # our blocking output dirs (work/blocking/<h>/train); [] = neural candidates only
lexical_test = []
lexical_top_k = 5
lexical_min_rel = 0.6
rules = true                      # also evaluate + export the hard-coded rule variant (output_rules/)
drop_s1_fold = 2                  # test-like decoy density: remove this share of one fold's Source-1
drop_s1_frac = 0.0                # entities from the training pool (their records become decoys); 0 = off
swap_features = false             # label-free word-swap statistics per country (sw_* features)
exclude_features = []

[stack.lgbm]
learning_rate = 0.05
num_leaves = 255
min_data_in_leaf = 100
feature_fraction = 0.8
bagging_fraction = 0.8
bagging_freq = 1
lambda_l2 = 1.0
max_bin = 255
seed = 7

[stack.fit]
num_boost_round = 4000
early_stopping_rounds = 100
