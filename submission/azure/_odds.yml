$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: amazites-final-blend-strictness
experiment_name: amazon-ml-2026
compute: azureml:aml26-cpu-e16
code: ..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
environment_variables:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
inputs:
  data:
    type: uri_folder
    mode: download
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/87666a896e8207989c312af14d2bbf86d6b80b6c532449d1ae8f178d617249bf/data/
  run6:
    type: uri_folder
    mode: download
    path: azureml://datastores/workspaceblobstore/paths/azureml/tough_band_bt1xq058cg/out/experiments/stack_run6_swap_only/stack/
  raj:
    type: uri_folder
    mode: download
    path: azureml://datastores/workspaceblobstore/paths/azureml/bold_zebra_g8snhj80gj/out/
  cand:
    type: uri_file
    path: azureml://datastores/workspaceblobstore/paths/azureml/jolly_heart_lfccvw0y0k/out/experiments/stack_upgraded_lex/output/candidate_pairs.tsv
outputs:
  out:
    type: uri_folder
    mode: upload
command: |
  set -eu
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv venv -q --python 3.13 /tmp/venv
  uv pip install -q --python /tmp/venv/bin/python -r requirements.txt
  nproc; free -g
  /tmp/venv/bin/python -u src/er/stack/final_blend.py --ours "${{inputs.run6}}" --raj "${{inputs.raj}}" \
    --prepared "${{inputs.data}}" --candidates "${{inputs.cand}}" --out "${{outputs.out}}" \
    --odds 1,0.8,0.6,0.45,0.3 --dump
  md5sum "${{outputs.out}}/matching_results.tsv"
