[project]
name = "amazon-er"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anyascii>=0.3",
    "catboost>=1.2.7",
    "faiss-cpu>=1.8",
    "joblib>=1.4",
    "lightgbm>=4.5",
    "numpy>=2",
    "polars>=1",
    "psutil>=6",
    "pyarrow>=17",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "sparse-dot-topn>=1.1",
    "unidecode==1.4.0",
]

[dependency-groups]
cloud = ["azure-ai-ml>=1.30", "azure-identity>=1.24", "azure-storage-blob>=12.20"]
neural = [
    "accelerate>=0.26",
    "huggingface-hub>=0.34,<1",
    "peft==0.18.1",
    "sentence-transformers>=5.1,<6",
    "torch==2.8.0",
    "transformers>=4.51,<5",
]

[tool.uv]
default-groups = ["cloud", "neural"]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
