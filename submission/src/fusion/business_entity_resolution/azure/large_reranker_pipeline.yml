  "jobs": {
    "prepare": {
      "type": "command",
      "display_name": "bounded-large-reranker-prepare",
      "compute": "azureml:amazites-cpu-v4",
      "code": "../..",
      "environment": {
        "image": "mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04"
      },
      "inputs": {
        "data": {
          "path": "${{parent.inputs.data}}",
          "mode": "download"
        },
        "hybrid_result": {
          "path": "${{parent.inputs.hybrid_result}}"
        },
        "features_train": {
          "path": "${{parent.inputs.features_train}}"
        },
        "features_test": {
          "path": "${{parent.inputs.features_test}}"
        },
        "friend": {
          "path": "${{parent.inputs.friend}}"
        },
        "graph": {
          "path": "${{parent.inputs.graph}}"
        }
      },
      "outputs": {
        "out": "${{parent.outputs.prepared}}"
      },
      "resources": {
        "instance_count": 1,
        "shm_size": "32g"
      },
      "limits": {
        "timeout": 5400
      },
      "command": "set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH=\"$HOME/.local/bin:$PATH\"; uv sync --frozen --python 3.13; ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen --python 3.13 pytest business_entity_resolution/tests/test_large_reranker_protocol.py business_entity_resolution/tests/test_large_reranker.py -q --disable-warnings; uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_large_reranker.py prepare --data \"${{inputs.data}}\" --hybrid-result \"${{inputs.hybrid_result}}\" --features-train \"${{inputs.features_train}}\" --features-test \"${{inputs.features_test}}\" --friend \"${{inputs.friend}}\" --graph \"${{inputs.graph}}\" --output \"${{outputs.out}}\" --max-targets 120000 --max-pairs 800000"
    },
    "train": {
      "type": "command",
      "display_name": "four-a100-reranker-lora-train",
      "compute": "azureml:amazites-verify-a100",
      "code": "../..",
      "environment": "azureml://registries/azureml/environments/acpt-pytorch-2.8-cuda12.6/versions/17",
      "inputs": {
        "prepared": {
          "path": "${{parent.jobs.prepare.outputs.out}}"
        }
      },
      "outputs": {
        "out": "${{parent.outputs.trained}}"
      },
      "resources": {
        "instance_count": 1,
        "shm_size": "32g"
      },
      "limits": {
        "timeout": 5400
      },
      "command": "set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH=\"$HOME/.local/bin:$PATH\"; uv sync --project upstream_neural --frozen --python 3.12; uv run --project upstream_neural --frozen --python 3.12 python business_entity_resolution/scripts/run_large_reranker.py train --prepared \"${{inputs.prepared}}\" --output \"${{outputs.out}}\" --workers 4 --batch 8 --epochs 2 --train-seconds 2400"
    },
    "score_0": {
      "type": "command",
      "display_name": "four-a100-reranker-score-0",
      "compute": "azureml:amazites-verify-a100",
      "code": "../..",
      "environment": "azureml://registries/azureml/environments/acpt-pytorch-2.8-cuda12.6/versions/17",
      "inputs": {
        "prepared": {
          "path": "${{parent.jobs.prepare.outputs.out}}"
        },
        "trained": {
          "path": "${{parent.jobs.train.outputs.out}}",
          "mode": "download"
        }
      },
      "outputs": {
        "out": "${{parent.outputs.scored_0}}"
      },
      "resources": {
        "instance_count": 1,
        "shm_size": "32g"
      },
      "limits": {
        "timeout": 7200
      },
      "command": "set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH=\"$HOME/.local/bin:$PATH\"; uv sync --project upstream_neural --frozen --python 3.12; uv run --project upstream_neural --frozen --python 3.12 python business_entity_resolution/scripts/run_large_reranker.py score --prepared \"${{inputs.prepared}}\" --trained \"${{inputs.trained}}\" --output \"${{outputs.out}}\" --workers 4 --batch 48 --shard-index 0 --shards 2"
    },
    "score_1": {
      "type": "command",
      "display_name": "four-a100-reranker-score-1",
      "compute": "azureml:amazites-verify-a100",
      "code": "../..",
      "environment": "azureml://registries/azureml/environments/acpt-pytorch-2.8-cuda12.6/versions/17",
      "inputs": {
        "prepared": {
          "path": "${{parent.jobs.prepare.outputs.out}}"
        },
        "trained": {
          "path": "${{parent.jobs.train.outputs.out}}",
