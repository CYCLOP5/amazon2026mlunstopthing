      "resources": {
        "instance_count": 1,
        "shm_size": "32g"
      },
      "limits": {
        "timeout": 7200
      },
      "command": "set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH=\"$HOME/.local/bin:$PATH\"; uv sync --project upstream_neural --frozen --python 3.12; uv run --project upstream_neural --frozen --python 3.12 python business_entity_resolution/scripts/run_large_reranker.py score --prepared \"${{inputs.prepared}}\" --trained \"${{inputs.trained}}\" --output \"${{outputs.out}}\" --workers 4 --batch 48 --shard-index 1 --shards 2"
    },
    "fit": {
      "type": "command",
      "display_name": "select-large-reranker-and-validate",
      "compute": "azureml:amazites-graph64",
      "code": "../..",
      "environment": {
        "image": "mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04"
      },
      "inputs": {
        "data": {
          "path": "${{parent.inputs.data}}",
          "mode": "download"
        },
        "hybrid_result": {
          "path": "${{parent.inputs.hybrid_result}}"
        },
        "features_train": {
          "path": "${{parent.inputs.features_train}}"
        },
        "features_test": {
          "path": "${{parent.inputs.features_test}}"
        },
        "friend": {
          "path": "${{parent.inputs.friend}}"
        },
        "graph": {
          "path": "${{parent.inputs.graph}}"
        },
        "prepared": {
          "path": "${{parent.jobs.prepare.outputs.out}}"
        },
        "scored": {
          "path": "${{parent.jobs.score_0.outputs.out}}"
        },
        "scored_extra": {
          "path": "${{parent.jobs.score_1.outputs.out}}"
        }
      },
      "outputs": {
        "out": "${{parent.outputs.result}}"
      },
      "resources": {
        "instance_count": 1,
        "shm_size": "32g"
      },
      "limits": {
        "timeout": 7200
      },
      "command": "set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH=\"$HOME/.local/bin:$PATH\"; uv sync --frozen --python 3.13; uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_large_reranker.py fit --data \"${{inputs.data}}\" --hybrid-result \"${{inputs.hybrid_result}}\" --features-train \"${{inputs.features_train}}\" --features-test \"${{inputs.features_test}}\" --friend \"${{inputs.friend}}\" --graph \"${{inputs.graph}}\" --prepared \"${{inputs.prepared}}\" --scored \"${{inputs.scored}}\" --scored-extra \"${{inputs.scored_extra}}\" --output \"${{outputs.out}}\" --rounds 500; uv run --frozen --python 3.13 python business_entity_resolution/scripts/validate_outputs.py --data \"${{inputs.data}}\" --output \"${{outputs.out}}/output\""
