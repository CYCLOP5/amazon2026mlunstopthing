    "trained": {
      "type": "uri_folder",
      "mode": "rw_mount"
    },
    "scored_0": {
      "type": "uri_folder",
      "mode": "rw_mount"
    },
    "scored_1": {
      "type": "uri_folder",
      "mode": "rw_mount"
    },
