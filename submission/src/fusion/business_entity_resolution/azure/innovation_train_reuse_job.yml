$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: amazites-verifier-owner-heldout-correction
experiment_name: amazon-ml-2026
compute: azureml:amazites-graph64
# Reuse completed CPU preparation and recovered frozen-E5 GPU verification.
# Recovery pipeline already trains this head: do not submit a duplicate while it runs.
code: ../..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
inputs:
  data:
    type: uri_folder
    mode: download
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/87666a896e8207989c312af14d2bbf86d6b80b6c532449d1ae8f178d617249bf/data/
  parent:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/azureml/bold_zebra_g8snhj80gj/out/
  prepared:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/azureml/28b02abb-9c68-4875-b124-b319b63cd366/out/
  verified:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/azureml/50121a7b-d69f-49a7-b5cc-c82e4fa48ad0/out/
outputs:
  out:
    type: uri_folder
    mode: rw_mount
limits:
  timeout: 10800
resources:
  instance_count: 1
  shm_size: 32g
command: >-
  set -eu;
  curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh;
  export PATH="$HOME/.local/bin:$PATH";
  uv sync --frozen;
  ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen pytest business_entity_resolution/tests/test_verification.py -q --disable-warnings;
  uv run --frozen python business_entity_resolution/scripts/run_innovation.py train
  --data "${{inputs.data}}" --parent "${{inputs.parent}}" --prepared "${{inputs.prepared}}"
  --verified "${{inputs.verified}}" --output "${{outputs.out}}";
  uv run --frozen python business_entity_resolution/scripts/validate_outputs.py
  --data "${{inputs.data}}" --output "${{outputs.out}}/output"
