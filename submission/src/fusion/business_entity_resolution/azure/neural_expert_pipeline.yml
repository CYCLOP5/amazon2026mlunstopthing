$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: amazites-independent-e5-large-partial-finetune
experiment_name: amazon-ml-2026
settings:
  default_compute: azureml:amazites-graph64
  continue_on_step_failure: false
inputs:
  data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/87666a896e8207989c312af14d2bbf86d6b80b6c532449d1ae8f178d617249bf/data/
  parent:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/bold_zebra_g8snhj80gj/out/
  prepared:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/28b02abb-9c68-4875-b124-b319b63cd366/out/
outputs:
  training:
    type: uri_folder
    mode: rw_mount
  expert:
    type: uri_folder
    mode: rw_mount
  result:
    type: uri_folder
    mode: rw_mount
jobs:
  prepare:
    type: command
    display_name: prepare-independent-owner-heldout-neural-training
    compute: azureml:amazites-cpu-v4
    code: ../..
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
    inputs:
      data: &id001
        path: ${{parent.inputs.data}}
        mode: download
      prepared: ${{parent.inputs.prepared}}
    outputs:
      out: ${{parent.outputs.training}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 3600
    command: set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH="$HOME/.local/bin:$PATH";
      uv sync --frozen --python 3.13; ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen --python 3.13 pytest business_entity_resolution/tests/test_neural_expert.py
      -q --disable-warnings; uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_neural_expert.py
      prepare --data "${{inputs.data}}" --prepared "${{inputs.prepared}}" --output "${{outputs.out}}" --max-pairs
      600000
  gpu:
    type: command
    display_name: partial-finetune-independent-e5-large-four-gpus
    compute: azureml:amazites-verify-a100
    code: ../..
    environment: azureml://registries/azureml/environments/acpt-pytorch-2.8-cuda12.6/versions/17
    inputs:
      training: ${{parent.jobs.prepare.outputs.out}}
      prepared: ${{parent.inputs.prepared}}
    outputs:
      out: ${{parent.outputs.expert}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 5400
    command: set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH="$HOME/.local/bin:$PATH";
      uv sync --project upstream_neural --frozen --python 3.12; uv run --project upstream_neural --frozen --python
      3.12 python -c "import torch; print('GPU preflight:', torch.__version__, torch.version.cuda, torch.cuda.device_count(),
      flush=True); assert torch.cuda.is_available() and torch.cuda.device_count() == 4"; uv run --project upstream_neural
      --frozen --python 3.12 python business_entity_resolution/scripts/run_neural_expert.py gpu --training "${{inputs.training}}"
      --prepared "${{inputs.prepared}}" --output "${{outputs.out}}" --workers 4 --batch 128 --train-seconds 2400
      --epochs 2
  fit:
    type: command
    display_name: fit-independent-neural-expert-owner-heldout
    compute: azureml:amazites-graph64
    code: ../..
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
    inputs:
      data: *id001
      parent: ${{parent.inputs.parent}}
      prepared: ${{parent.inputs.prepared}}
      expert: ${{parent.jobs.gpu.outputs.out}}
    outputs:
      out: ${{parent.outputs.result}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 3600
    command: set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH="$HOME/.local/bin:$PATH";
      uv sync --frozen --python 3.13; ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen --python 3.13 pytest business_entity_resolution/tests/test_expert_fit.py
      -q --disable-warnings; uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_neural_expert.py
      fit --data "${{inputs.data}}" --parent "${{inputs.parent}}" --prepared "${{inputs.prepared}}" --expert "${{inputs.expert}}"
      --output "${{outputs.out}}"; uv run --frozen --python 3.13 python business_entity_resolution/scripts/validate_outputs.py
      --data "${{inputs.data}}" --output "${{outputs.out}}/output"
