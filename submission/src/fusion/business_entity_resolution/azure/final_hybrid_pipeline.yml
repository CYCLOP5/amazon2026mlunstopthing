$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: amazites-final-bounded-hybrid
experiment_name: amazon-ml-2026
settings:
  default_compute: azureml:amazites-graph64
  continue_on_step_failure: false
inputs:
  data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/87666a896e8207989c312af14d2bbf86d6b80b6c532449d1ae8f178d617249bf/data/
  parent:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/bold_zebra_g8snhj80gj/out/
  prepared:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/28b02abb-9c68-4875-b124-b319b63cd366/out/
  old_model:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/9e1084f60d9a6b9a4023bb0f69ab568281e2aebb7b2b88bedf9c7a54236751c9/model/
  verified:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/50121a7b-d69f-49a7-b5cc-c82e4fa48ad0/out/
  expert:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/dc8388c1-af68-49f9-8d29-7d4cecaa8336/out/
outputs:
  lexical_train:
    type: uri_folder
    mode: rw_mount
  lexical_test:
    type: uri_folder
    mode: rw_mount
  hybrid:
    type: uri_folder
    mode: rw_mount
  result:
    type: uri_folder
    mode: rw_mount
jobs:
  lexical_train:
    type: command
    display_name: lexical-hybrid-train
    compute: azureml:amazites-cpu-v4
    code: ../..
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
    inputs:
      data:
        path: ${{parent.inputs.data}}
        mode: download
      prepared: ${{parent.inputs.prepared}}
    outputs:
      out: ${{parent.outputs.lexical_train}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 5400
    command: set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH="$HOME/.local/bin:$PATH";
      uv sync --frozen --python 3.13; ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen --python 3.13 pytest business_entity_resolution/tests/test_final_hybrid_prepare.py
      -q --disable-warnings; uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_final_hybrid.py
      prepare --data "${{inputs.data}}" --prepared "${{inputs.prepared}}" --output "${{outputs.out}}" --split train
      --topk 8 --threads 24
  lexical_test:
    type: command
    display_name: lexical-hybrid-test
    compute: azureml:amazites-graph64
    code: ../..
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
    inputs:
      data:
        path: ${{parent.inputs.data}}
        mode: download
      prepared: ${{parent.inputs.prepared}}
    outputs:
      out: ${{parent.outputs.lexical_test}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 5400
    command: set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH="$HOME/.local/bin:$PATH";
      uv sync --frozen --python 3.13; ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen --python 3.13 pytest business_entity_resolution/tests/test_final_hybrid_prepare.py
      -q --disable-warnings; uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_final_hybrid.py
      prepare --data "${{inputs.data}}" --prepared "${{inputs.prepared}}" --output "${{outputs.out}}" --split test
      --topk 8 --threads 24
  gpu:
    type: command
    display_name: hybrid-field-retrieval-and-reused-cross-encoders
    compute: azureml:amazites-verify-a100
    code: ../..
    environment: azureml://registries/azureml/environments/acpt-pytorch-2.8-cuda12.6/versions/17
    inputs:
      prepared: ${{parent.inputs.prepared}}
      lexical_train: ${{parent.jobs.lexical_train.outputs.out}}
      lexical_test: ${{parent.jobs.lexical_test.outputs.out}}
      old_model:
        path: ${{parent.inputs.old_model}}
        mode: download
      verified: ${{parent.inputs.verified}}
      expert: ${{parent.inputs.expert}}
    outputs:
      out: ${{parent.outputs.hybrid}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 9000
    command: set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH="$HOME/.local/bin:$PATH";
      uv sync --project upstream_neural --frozen --python 3.12; uv run --project upstream_neural --frozen --python
      3.12 python -m py_compile business_entity_resolution/scripts/run_final_hybrid.py; uv run --project upstream_neural
      --frozen --python 3.12 python -c "import torch; print('GPU preflight:',torch.__version__,torch.version.cuda,torch.cuda.device_count(),flush=True);
      assert torch.cuda.is_available() and torch.cuda.device_count()==4"; uv run --project upstream_neural --frozen
      --python 3.12 python business_entity_resolution/scripts/run_final_hybrid.py gpu --prepared "${{inputs.prepared}}"
      --lexical-train "${{inputs.lexical_train}}" --lexical-test "${{inputs.lexical_test}}" --old-model "${{inputs.old_model}}"
      --verified "${{inputs.verified}}" --expert "${{inputs.expert}}" --output "${{outputs.out}}" --workers 4 --batch
      128
  fit:
    type: command
    display_name: fit-weighted-hybrid-residual-and-validate
    compute: azureml:amazites-graph64
    code: ../..
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
    inputs:
      data:
        path: ${{parent.inputs.data}}
        mode: download
      parent: ${{parent.inputs.parent}}
      prepared: ${{parent.inputs.prepared}}
      hybrid: ${{parent.jobs.gpu.outputs.out}}
    outputs:
      out: ${{parent.outputs.result}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 7200
    command: set -eu; curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh; export PATH="$HOME/.local/bin:$PATH";
      uv sync --frozen --python 3.13; ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen --python 3.13 pytest business_entity_resolution/tests/test_final_hybrid_fit.py
      -q --disable-warnings; uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_final_hybrid.py
      fit --data "${{inputs.data}}" --parent "${{inputs.parent}}" --prepared "${{inputs.prepared}}" --hybrid "${{inputs.hybrid}}"
      --output "${{outputs.out}}" --rounds 800; uv run --frozen --python 3.13 python business_entity_resolution/scripts/validate_outputs.py
      --data "${{inputs.data}}" --output "${{outputs.out}}/output"
