$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
name: amazites-strength125-review-20260927-01
display_name: amazites-strength125-review-20260927-01
experiment_name: amazon-ml-2026
compute: azureml:amazites-cpu-v4
code: ../..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
resources:
  instance_count: 1
  shm_size: 32g
limits:
  timeout: 2400
environment_variables:
  ER_THREADS: "64"
  POLARS_MAX_THREADS: "48"
  OMP_NUM_THREADS: "64"
  OPENBLAS_NUM_THREADS: "1"
  ER_DECODER_THREADS: "32"
inputs:
  data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/34424852455351d9d8c06dba0370c88bccc8b762e34f31033722ffd91d6c7a36/learned-assets/data/
    mode: download
  train:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/c4da719f-d934-45ca-84a7-738a0810e1a8/out/
    mode: download
  test:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/e1279250-583f-4921-a2cf-b310ffaef6ec/out/
    mode: download
  completed:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/amazites-competition-strength-20260927-01/out/
    mode: ro_mount
outputs:
  out:
    type: uri_folder
    mode: upload
command: >-
  set -eu;
  curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh;
  export PATH="$HOME/.local/bin:$PATH";
  uv sync --frozen --python 3.13;
  ER_THREADS=2 ER_DECODER_THREADS=2 POLARS_MAX_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen --python 3.13 python -m pytest business_entity_resolution/tests/test_tradeoff_review.py business_entity_resolution/tests/test_review_export.py business_entity_resolution/tests/test_fusion_tuning.py -q --disable-warnings;
  uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_tradeoff_review.py
  --data "${{inputs.data}}"
  --train "${{inputs.train}}/prepared-train.parquet"
  --test "${{inputs.test}}/prepared-test.parquet"
  --completed "${{inputs.completed}}"
  --metadata business_entity_resolution/configs/latest_fusion.json
  --trial competition63_1.25
  --expected-sha 0f91f8ec752bfba46a30aecc15488ee8b7a31a835de8ed808944db1f8a4e16ef
  --output "${{outputs.out}}"
