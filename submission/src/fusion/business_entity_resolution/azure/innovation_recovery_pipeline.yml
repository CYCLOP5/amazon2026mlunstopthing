$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: amazites-frozen-e5-recovery-owner-heldout
experiment_name: amazon-ml-2026
settings:
  default_compute: azureml:amazites-graph64
  continue_on_step_failure: false
# CPU preparation and allocation from magenta_station_5b1cgdh7gy succeeded.
# Reuse them; this recovery contains only the failed GPU stage and corrected head.
inputs:
  data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/87666a896e8207989c312af14d2bbf86d6b80b6c532449d1ae8f178d617249bf/data/
  parent:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/bold_zebra_g8snhj80gj/out/
  prepared:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/azureml/28b02abb-9c68-4875-b124-b319b63cd366/out/
  model:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/9e1084f60d9a6b9a4023bb0f69ab568281e2aebb7b2b88bedf9c7a54236751c9/model/
outputs:
  verified:
    type: uri_folder
    mode: rw_mount
  verifier:
    type: uri_folder
    mode: rw_mount
jobs:
  verify:
    type: command
    display_name: frozen-e5-python312-recovery-four-gpus
    compute: azureml:amazites-verify-a100
    code: ../..
    environment: azureml://registries/azureml/environments/acpt-pytorch-2.8-cuda12.6/versions/17
    inputs:
      prepared: ${{parent.inputs.prepared}}
      model:
        path: ${{parent.inputs.model}}
        mode: download
    outputs:
      out: ${{parent.outputs.verified}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 21600
    command: >-
      set -eu;
      curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh;
      export PATH="$HOME/.local/bin:$PATH";
      uv sync --project upstream_neural --frozen --python 3.12;
      uv run --project upstream_neural --frozen --python 3.12 python -c
      "import torch; print('GPU preflight:', torch.__version__, torch.version.cuda, torch.cuda.device_count(), flush=True); assert torch.cuda.is_available() and torch.cuda.device_count() == 4";
      uv run --project upstream_neural --frozen --python 3.12 python business_entity_resolution/scripts/run_innovation.py verify
      --prepared "${{inputs.prepared}}" --model "${{inputs.model}}"
      --output "${{outputs.out}}" --workers 4 --batch 128
  train:
    type: command
    display_name: fit-verifier-true-owner-heldout
    code: ../..
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
    inputs:
      data:
        path: ${{parent.inputs.data}}
        mode: download
      parent: ${{parent.inputs.parent}}
      prepared: ${{parent.inputs.prepared}}
      verified: ${{parent.jobs.verify.outputs.out}}
    outputs:
      out: ${{parent.outputs.verifier}}
    resources:
      instance_count: 1
      shm_size: 32g
    limits:
      timeout: 10800
    command: >-
      set -eu;
      curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh;
      export PATH="$HOME/.local/bin:$PATH";
      uv sync --frozen;
      ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen pytest business_entity_resolution/tests/test_verification.py -q --disable-warnings;
      uv run --frozen python business_entity_resolution/scripts/run_innovation.py train
      --data "${{inputs.data}}" --parent "${{inputs.parent}}" --prepared "${{inputs.prepared}}"
      --verified "${{inputs.verified}}" --output "${{outputs.out}}";
      uv run --frozen python business_entity_resolution/scripts/validate_outputs.py
      --data "${{inputs.data}}" --output "${{outputs.out}}/output"
