$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: amazites-learned-edit-channel
experiment_name: amazon-ml-2026
compute: azureml:amazites-graph64
code: ../..
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
inputs:
  data:
    type: uri_folder
    mode: download
    path: azureml://datastores/workspaceblobstore/paths/LocalUpload/87666a896e8207989c312af14d2bbf86d6b80b6c532449d1ae8f178d617249bf/data/
  parent:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/azureml/bold_zebra_g8snhj80gj/out/
  prepared:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/azureml/28b02abb-9c68-4875-b124-b319b63cd366/out/
outputs:
  out:
    type: uri_folder
    mode: rw_mount
limits:
  timeout: 7200
resources:
  instance_count: 1
  shm_size: 32g
command: >-
  set -eu;
  curl -LsSf https://astral.sh/uv/0.7.16/install.sh | sh;
  export PATH="$HOME/.local/bin:$PATH";
  uv sync --frozen --python 3.13;
  ER_THREADS=2 ER_MIN_FREE_GB=0 uv run --frozen --python 3.13 pytest business_entity_resolution/tests/test_edit_channel.py -q --disable-warnings;
  uv run --frozen --python 3.13 python business_entity_resolution/scripts/run_edit_channel.py
  --data "${{inputs.data}}" --parent "${{inputs.parent}}" --prepared "${{inputs.prepared}}"
  --output "${{outputs.out}}" --workers 24 --rounds 1000;
  uv run --frozen --python 3.13 python business_entity_resolution/scripts/validate_outputs.py
  --data "${{inputs.data}}" --output "${{outputs.out}}/output"
